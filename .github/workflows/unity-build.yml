name: Unity Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      buildTarget:
        description: 'Build target'
        required: true
        default: 'Android'
        type: choice
        options:
          - Android
          - iOS
          - WebGL

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          hashFiles: Library/**

      - name: Test Mode
        id: testsMode
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          testMode: EditMode
          artifactsPath: unity-test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test Results

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test Results (EditMode)
          path: unity-test-results

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    if: github.event.inputs.buildTarget == 'Android' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          hashFiles: Library/**

      - name: Build Android APK
        id: buildPlayer
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: BreachAR
          buildsPath: builds
          androidExportType: apk
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_NAME }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: Android Build
          path: builds/Android

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: test
    if: github.event.inputs.buildTarget == 'iOS'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          hashFiles: Library/**

      - name: Build iOS Xcode Project
        id: buildPlayer
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          buildName: BreachAR
          buildsPath: builds

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: iOS Build
          path: builds/iOS

  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest
    needs: test
    if: github.event.inputs.buildTarget == 'WebGL'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          hashFiles: Library/**

      - name: Build WebGL
        id: buildPlayer
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: BreachAR
          buildsPath: builds

      - name: Upload WebGL Build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL Build
          path: builds/WebGL

  deploy-webgl:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-webgl
    if: github.event.inputs.buildTarget == 'WebGL'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/WebGL

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
